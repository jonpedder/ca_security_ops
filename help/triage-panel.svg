<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Initial triage controls</title><desc id="d">Annotated selected incident triage form.</desc><style>.h{font:700 20px Arial;fill:#f2a900}.l{font:700 12px Arial;fill:#afc3cf}.v{font:15px Arial;fill:#f4f7f9}.n{fill:#f2a900;stroke:#071824;stroke-width:3}.nt{font:700 16px Arial;fill:#111;text-anchor:middle;dominant-baseline:middle}.ln{stroke:#f2a900;stroke-width:3;fill:none}.cap{font:700 14px Arial;fill:#f4f7f9}</style><rect width="1000" height="520" fill="#071824"/><rect x="135" y="35" width="730" height="440" fill="#0c2231" stroke="#28495b" stroke-width="2"/><text x="170" y="78" class="h">INCIDENT TRIAGE</text><text x="170" y="113" class="l">PRIORITY</text><rect x="170" y="124" width="300" height="44" fill="#123247" stroke="#28495b"/><text x="188" y="151" class="v">High</text><text x="530" y="113" class="l">STATUS</text><rect x="530" y="124" width="300" height="44" fill="#123247" stroke="#28495b"/><text x="548" y="151" class="v">Pending</text><text x="170" y="204" class="l">ADD NOTE</text><rect x="170" y="215" width="660" height="112" fill="#123247" stroke="#28495b"/><text x="188" y="246" class="v">Verified source and location. Operational impact…</text><rect x="170" y="350" width="180" height="45" fill="#f2a900"/><text x="260" y="378" text-anchor="middle" font-family="Arial" font-weight="700" fill="#111">Update incident</text><rect x="365" y="350" width="145" height="45" fill="none" stroke="#f2a900"/><text x="437" y="378" text-anchor="middle" font-family="Arial" font-weight="700" fill="#f2a900">Audit trail</text><rect x="525" y="350" width="145" height="45" fill="none" stroke="#f2a900"/><text x="597" y="378" text-anchor="middle" font-family="Arial" font-weight="700" fill="#f2a900">Incident PDF</text><text x="170" y="430" class="l">Updates are attributed to the signed-in user with date and time.</text><path class="ln" d="M310 124 L225 52"/><circle class="n" cx="225" cy="52" r="17"/><text class="nt" x="225" y="52">1</text><path class="ln" d="M680 124 L770 52"/><circle class="n" cx="770" cy="52" r="17"/><text class="nt" x="770" y="52">2</text><path class="ln" d="M490 215 L490 74"/><circle class="n" cx="490" cy="74" r="17"/><text class="nt" x="490" y="74">3</text><path class="ln" d="M260 395 L95 430"/><circle class="n" cx="95" cy="430" r="17"/><text class="nt" x="95" y="430">4</text><path class="ln" d="M520 373 L890 420"/><circle class="n" cx="890" cy="420" r="17"/><text class="nt" x="890" y="420">5</text><text x="25" y="500" class="cap">1 Set impact priority   2 Choose workflow status   3 Document evidence and recommendation   4 Save   5 Verify or report</text></svg>